name: CI

on:
  pull_request: # Need to run on pull-requests, otherwise PRs from forks don't run
  push:
    branches:
      - "master" # Always build head of master for the badge in the README
      - "ci/5.0.3-hot12" # fork only: the full suite on the 5.0.3 port, without a PR

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static_analysis:
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' || !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # fork: the clippy gate lints pristine 5.0.3 too

      - name: Free runner disk (fork, the gate keeps two trees' clippy output)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      - name: Setup build environment (cli tools, dependencies)
        uses: ./.github/actions/setup-build-environment
        with:
          host: ubuntu-22.04

      # fork (12/11/2026): upstream's clippy step fails on 5.0.3 itself and stops at the first
      # crate with a finding, before the crates the fork changed. This lints every crate of the
      # fork and of pristine 5.0.3 (--cap-lints warn, default and all features) and fails only on
      # findings that 5.0.3 does not have at the same place (see .github/scripts/clippy_gate.py).
      - name: Clippy gate (fork) - every crate, the fork against pristine 5.0.3
        run: bash .github/scripts/clippy_gate.sh

      - name: Run clippy with default features
        run: bash .github/scripts/annotate.sh cargo clippy --workspace --all-targets -- -D warnings

      - name: Run clippy with all features enabled
        run: bash .github/scripts/annotate.sh cargo clippy --workspace --all-targets --all-features -- -D warnings

  gui_eslint:
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' || !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v4

      - name: Setup build environment (cli tools, dependencies)
        uses: ./.github/actions/setup-build-environment
        with:
          host: ubuntu-22.04

      - name: Run GUI eslint checks
        run: just check_gui_eslint

  gui_tsc:
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' || !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v4

      - name: Setup build environment (cli tools, dependencies)
        uses: ./.github/actions/setup-build-environment
        with:
          host: ubuntu-22.04

      - name: Run GUI generate bindings
        run: just bindings

      - name: Run GUI tsc checks
        run: just check_gui_tsc

  sqlx_test:
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' || !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v4
      - name: Setup build environment (cli tools, dependencies)
        uses: ./.github/actions/setup-build-environment
        with:
          host: ubuntu-22.04

      - name: Run sqlx cache setup script
        run: |
          just generate-sqlx-cache

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-pc-windows-gnu
            os: ubuntu-22.04

    runs-on: ${{ matrix.os }}
    if: github.event_name == 'push' || !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v4
      - name: Setup build environment (cli tools, dependencies)
        uses: ./.github/actions/setup-build-environment
        with:
          host: ${{ matrix.os }}
          target: ${{ matrix.target }}

      - name: Build binary
        run: cargo build -p swap --target ${{ matrix.target }} -vv

      - name: Upload swap binary
        uses: actions/upload-artifact@v4
        with:
          name: swap-${{ matrix.target }}
          path: target/${{ matrix.target }}/debug/swap

      - name: Upload asb binary
        uses: actions/upload-artifact@v4
        with:
          name: asb-${{ matrix.target }}
          path: target/${{ matrix.target }}/debug/asb

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'push' || !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v4
      - name: Setup build environment (cli tools, dependencies)
        uses: ./.github/actions/setup-build-environment
        with:
          host: ${{ matrix.os }}

      - name: Run monero-harness tests
        if: matrix.os == 'ubuntu-22.04'
        run: bash .github/scripts/annotate.sh cargo test --package monero-harness --all-features

      - name: Run library tests
        # fork only: --no-fail-fast so a failing crate does not hide the swap crate's tests
        run: bash .github/scripts/annotate.sh cargo test --lib --no-fail-fast

      # The other tests of the swap binary are outdated
      - name: Run swap binary fee test
        run: bash .github/scripts/annotate.sh cargo test --package swap --bin swap swap_fee_excludes_funds_outside_the_input_limit

      - name: Run Monero conflict tests
        run: bash .github/scripts/annotate.sh cargo test --package monero-tests --test double_spend

      - name: Run Monero construction throttle tests
        run: bash .github/scripts/annotate.sh cargo test --manifest-path monero-wallet/Cargo.toml --test construction_throttle

      - name: Run maker fee config tests
        run: bash .github/scripts/annotate.sh cargo test --package swap-env --test maker_fee_config

      - name: Run env config tests (fork, 40 min mainnet lock retry window)
        run: bash .github/scripts/annotate.sh cargo test --package swap-env --test trusted_daemon_config

  # fork (12/11/2026): upstream's CI fails "Run library tests" on 5.0.3 itself (run 42796064507,
  # ubuntu and macos). The same command on pristine 5.0.3, published as annotations, so each
  # failing test of the fork's run can be checked against upstream's own. Never fails the run.
  baseline_lib_tests:
    runs-on: ubuntu-22.04
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out pristine 5.0.3, keeping the fork's annotate.sh
        run: |
          cp .github/scripts/annotate.sh "$RUNNER_TEMP/annotate.sh"
          git checkout --force 5664a2dc2066f188ed2196a65261c61302635f38
          git log -1 --format='%H %s'

      - name: Setup build environment (cli tools, dependencies)
        uses: ./.github/actions/setup-build-environment
        with:
          host: ubuntu-22.04

      - name: Library tests on pristine 5.0.3 (upstream baseline)
        continue-on-error: true
        run: bash "$RUNNER_TEMP/annotate.sh" cargo test --lib --no-fail-fast

  docker_tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: bitcoin-wallet
            test_name: integration
          - package: swap
            test_name: happy_path
          - package: swap
            test_name: happy_path_alice_developer_tip
          - package: swap
            test_name: happy_path_alice_developer_tip_subaddress
          - package: swap
            test_name: happy_path_bob_donates_to_developer
          - package: swap
            test_name: happy_path_bob_donates_to_developer_subaddress
          - package: swap
            test_name: happy_path_restart_bob_after_xmr_locked
          - package: swap
            test_name: happy_path_restart_bob_before_xmr_locked
          - package: swap
            test_name: happy_path_restart_alice_after_xmr_locked
          - package: swap
            test_name: happy_path_hermes_disabled
          - package: swap
            test_name: happy_path_no_p2p_after_btc_lock
          - package: swap
            test_name: alice_and_bob_refund_using_cancel_and_refund_command
          - package: swap
            test_name: alice_and_bob_refund_using_cancel_then_refund_command
          - package: swap
            test_name: refund_requires_confirmed_cancel
          - package: swap
            test_name: alice_and_bob_refund_using_cancel_and_refund_command_timelock_not_expired
          - package: swap
            test_name: alice_manually_punishes_after_bob_dead_and_bob_cancels
          - package: swap
            test_name: punish
          - package: swap
            test_name: alice_punishes_after_restart_bob_dead
          - package: swap
            test_name: alice_manually_punishes_after_bob_dead
          - package: swap
            test_name: alice_refunds_after_restart_bob_refunded
          - package: swap
            test_name: ensure_same_swap_id
          - package: swap
            test_name: happy_path_bob_recovers_swap_from_apollo
          - package: swap
            test_name: happy_path_bob_recovers_swap_from_apollo_after_alice_redeemed
          # fork: 90 min, not 45 (upstream's own run 42796064507 lost
          # concurrent_bobs_before_xmr_lock_proof_sent to the 45 min job timeout, ~30 of which
          # go to the build); the fork's lock phase also serializes the two swaps' Monero locks
          - package: swap
            test_name: concurrent_bobs_before_xmr_lock_proof_sent
            timeout_minutes: 90
          - package: swap
            test_name: concurrent_bobs_after_xmr_lock_proof_sent
            timeout_minutes: 90
          # fork: the serialized Monero lock phase and the wait for our locked change
          - package: swap
            test_name: concurrent_bobs_insufficient_xmr
            timeout_minutes: 90
          - package: swap
            test_name: concurrent_bobs_wait_for_locked_change
            timeout_minutes: 90
          - package: swap
            test_name: alice_cancels_while_waiting_for_xmr_construction_turn
          - package: swap
            test_name: alice_waits_for_xmr_construction_cooldown
          - package: swap
            test_name: xmr_construction_discards_cancelled_native_result
          - package: swap
            test_name: alice_manually_redeems_after_enc_sig_learned
          - package: swap
            test_name: alice_refuses_cooperative_redeem_for_malicious_swap
          - package: swap
            test_name: happy_path_bob_offline_while_alice_redeems_btc
          - package: swap
            test_name: alice_empty_balance_after_started_btc_early_refund
          - package: swap
            test_name: alice_broken_wallet_rpc_after_started_btc_early_refund
          - package: swap
            test_name: alice_rebuilds_xmr_lock_after_confirmed_double_spend
          - package: swap
            test_name: alice_does_not_rebuild_xmr_lock_with_untrusted_daemon
          - package: swap
            test_name: alice_does_not_rebuild_xmr_lock_for_mempool_double_spend
          - package: swap
            test_name: alice_does_not_rebuild_xmr_lock_when_shared_wallet_not_empty
          - package: swap
            test_name: happy_path_alice_does_not_send_transfer_proof
          - package: swap
            test_name: partial_refund_bob_claims_amnesty
          - package: swap
            test_name: partial_refund_alice_burns
          - package: swap
            test_name: partial_refund_alice_burns_after_command
          - package: swap
            test_name: partial_refund_alice_grants_final_amnesty
          - package: swap
            test_name: swap_rejected_deposit_too_small
          - package: swap
            test_name: swap_rejected_invalid_bitcoin_lock_input
          - package: swap
            test_name: bob_abandons_swap_setup_before_committing
          - package: swap
            test_name: bob_declines_swap_setup
          - package: swap
            test_name: bob_does_not_lock_when_alice_fails_to_persist_swap
          - package: swap
            test_name: bob_does_not_lock_when_alice_database_is_locked
          - package: swap
            test_name: bob_does_not_publish_btc_lock_after_deadline
          - package: swap
            test_name: swap_rejected_low_bitcoin_lock_fee
          - package: swap
            test_name: partial_refund_bob_restart_detects_withhold
          - package: swap
            test_name: alice_and_bob_refund_using_cancel_and_refund_command_partial_refund
          - package: swap
            test_name: alice_and_bob_refund_using_cancel_and_refund_command_partial_refund_withheld
          - package: swap
            test_name: bob_refunds_when_xmr_amount_is_not_exact
          - package: swap
            test_name: set_external_bitcoin_redeem_address
          - package: monero-sys
            test_name: restore_wallet
          - package: monero-tests
            test_name: reserve_proof
          - package: monero-tests
            test_name: transaction_keys
          - package: monero-tests
            test_name: transfers
          - package: monero-tests
            test_name: transfers_wrong_key
          - package: monero-tests
            test_name: sweep

    runs-on: ubuntu-22.04
    timeout-minutes: ${{ matrix.timeout_minutes || 90 }}
    if: github.event_name == 'push' || !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v4

      - name: Setup build environment (cli tools, dependencies)
        uses: ./.github/actions/setup-build-environment
        with:
          host: ubuntu-22.04

      - name: Run test ${{ matrix.test_name }}
        # fork only: stop a hang 8 min before the job's own timeout, so its last 60 lines are
        # published as an annotation (job logs need admin rights, annotations do not)
        run: bash .github/scripts/annotate.sh timeout -s INT -k 120 $(( (${{ matrix.timeout_minutes || 90 }} - 8) * 60 )) cargo test --package ${{ matrix.package }} --test ${{ matrix.test_name }} -- --nocapture

  check_stable:
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' || !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v4
      - name: Setup build environment (cli tools, dependencies)
        uses: ./.github/actions/setup-build-environment
        with:
          host: ubuntu-22.04

      - name: Run cargo check on stable rust
        run: cargo check --all-targets
