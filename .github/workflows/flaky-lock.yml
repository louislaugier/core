name: flaky-lock

# fork only (28/09/2026): repeat the lock-path docker tests to measure how often each fails.
# 02/10/2026: clippy on the crates the fork patches (the workspace run stops at upstream's
# monero-wallet-ng lints, so ours were never linted), and our own test 5 more times.
on:
  push:
    branches:
      - "ci/hot8-4150-flaky"

jobs:
  clippy_ours:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup build environment (cli tools, dependencies)
        uses: ./.github/actions/setup-build-environment
        with:
          host: ubuntu-22.04

      - name: Clippy on swap, swap-feed, swap-p2p, swap-asb, monero-sys (no deps, keep going)
        # 02/10: upstream lints in swap-feed and monero-sys failed those crates under -D warnings,
        # which left swap/swap-p2p/swap-asb unchecked: lints stay warnings so every crate is
        # checked, and each diagnostic is published for matching against the fork's diff
        run: |
          set +e
          cargo clippy -p swap -p swap-feed -p swap-p2p -p swap-asb -p monero-sys --all-targets \
            --no-deps --keep-going --message-format=short -- --cap-lints warn > clippy.log 2>&1
          rc=$?
          sed 's/\x1b\[[0-9;]*m//g' clippy.log | grep -E '(error|warning)(\[[A-Za-z0-9]+\])?: ' \
            | grep -v 'monero-sys@' | sort -u > diag.txt
          n=$(wc -l < diag.txt)
          # always publish what clippy did: a green job must prove it linted (02/10/2026)
          tail_=$(sed 's/\x1b\[[0-9;]*m//g' clippy.log | grep -v 'monero-sys@' | tail -25 | cut -c1-250)
          printf '::notice title=clippy rc=%s diagnostics=%s::%s\n' "$rc" "$n" \
            "$(printf '%s\n' "$tail_" | awk '{printf "%s%%0A", $0}')"
          # the fork's own .rs files first (git diff 4.15.0..ci/hot8-4150): GitHub keeps only
          # 10 warning annotations per step, so these must never be crowded out
          OURS='^(monero-sys/src/lib.rs|swap-feed/src/(rate|traits).rs|swap-p2p/src/patches/identify.rs|swap/src/(asb/event_loop|cli/api/request|cli/command|network/swarm|protocol/alice|protocol/alice/lock_phase|protocol/alice/swap).rs|swap/tests/(alice_empty_balance_after_started_btc_early_refund|concurrent_bobs_insufficient_xmr|harness/mod).rs):'
          grep -E "$OURS" diag.txt > ours.txt
          grep -vE "$OURS" diag.txt > theirs.txt
          printf '::error title=clippy OURS (%s lines)::%s\n' "$(wc -l < ours.txt)" \
            "$(head -60 ours.txt | awk '{printf "%s%%0A", $0}')"
          for f in $(seq 1 40 "$(wc -l < theirs.txt)"); do
            printf '::warning title=clippy (%s)::%s\n' "$f" "$(sed -n "${f},$((f+39))p" theirs.txt | awk '{printf "%s%%0A", $0}')"
          done
          exit "$rc"

  repeat:
    strategy:
      fail-fast: false
      matrix:
        test_name:
          - concurrent_bobs_insufficient_xmr
        rep: [1, 2, 3, 4, 5]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup build environment (cli tools, dependencies)
        uses: ./.github/actions/setup-build-environment
        with:
          host: ubuntu-22.04

      - name: Run ${{ matrix.test_name }} (rep ${{ matrix.rep }})
        run: bash .github/scripts/annotate.sh timeout -s INT -k 120 3600 cargo test --package swap --test ${{ matrix.test_name }} -- --nocapture
