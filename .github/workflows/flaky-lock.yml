name: flaky-lock

# fork only (28/09/2026): repeat the lock-path docker tests to measure how often each fails.
# 02/10/2026: clippy on the crates the fork patches (the workspace run stops at upstream's
# monero-wallet-ng lints, so ours were never linted), and our own test 5 more times.
on:
  push:
    branches:
      - "ci/hot8-4150-flaky"

jobs:
  clippy_ours:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup build environment (cli tools, dependencies)
        uses: ./.github/actions/setup-build-environment
        with:
          host: ubuntu-22.04

      - name: Clippy on swap, swap-feed, swap-p2p, swap-asb, monero-sys (no deps, keep going)
        # 02/10: one upstream lint in swap-feed/src/kucoin.rs stopped the build before our crates;
        # --keep-going lints every crate, and the short format keeps one line per diagnostic
        run: |
          set -o pipefail
          cargo clippy -p swap -p swap-feed -p swap-p2p -p swap-asb -p monero-sys --all-targets \
            --no-deps --keep-going --message-format=short -- -D warnings 2>&1 | tee clippy.log || true
          grep -E '^(swap|swap-feed|swap-p2p|swap-asb|monero-sys)/[^ ]+:[0-9]+:[0-9]+: (error|warning)' clippy.log \
            | sort -u > ours.txt || true
          echo "Rust diagnostics: $(wc -l < ours.txt)"
          if [ -s ours.txt ]; then
            for f in $(seq 1 40 $(wc -l < ours.txt)); do
              printf '::error title=clippy (%s)::%s\n' "$f" "$(sed -n "${f},$((f+39))p" ours.txt | awk '{printf "%s%%0A", $0}')"
            done
            exit 1
          fi

  repeat:
    strategy:
      fail-fast: false
      matrix:
        test_name:
          - concurrent_bobs_insufficient_xmr
        rep: [1, 2, 3, 4, 5]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup build environment (cli tools, dependencies)
        uses: ./.github/actions/setup-build-environment
        with:
          host: ubuntu-22.04

      - name: Run ${{ matrix.test_name }} (rep ${{ matrix.rep }})
        run: bash .github/scripts/annotate.sh timeout -s INT -k 120 3600 cargo test --package swap --test ${{ matrix.test_name }} -- --nocapture
