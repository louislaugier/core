# Fork only (05/10/2026): build-asb-mutex builds the maker image but runs no test. This runs
# the unit tests of the fork's own changes on every ci/** push (5.0.3 port 12/11, 5.0.4 16/11/2026):
# the serialized Monero lock phase (lock_phase), the wait for our locked change
# (unlock_wait_tests), the setup check that leaves out Monero reserved by swaps in flight
# (setup_reserve_tests), the js-libp2p flood guards (flood_agent_tests, flood_decode_tests),
# the quote tests with the 1 % max headroom (asb::event_loop::tests), and the 40 min mainnet
# lock retry window (swap-env's trusted_daemon_config).
name: fork-unit-tests
on:
  push:
    branches:
      - 'ci/**'
  workflow_dispatch:
# fork (12/11/2026): a newer push to the same branch cancels the run still going, as ci.yml
# does: the image and the unit tests of the branch's latest commit are the ones that count
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# fork (16/11/2026): on a *-red branch only the red-first tests of the quote-timeout fix run, on
# port/5.0.4-hot12 (d9e1dcee6) without the fix. Both jobs are expected to FAIL.
jobs:
  red-bitcoin-wallet:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - name: free runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
      - name: Setup build environment (cli tools, dependencies)
        uses: ./.github/actions/setup-build-environment
        with:
          host: ubuntu-22.04
      - name: Serial fee estimate (expected red without the fix)
        run: >-
          bash .github/scripts/annotate.sh
          cargo test --package bitcoin-wallet --lib -- fee_rate_serial_tests
  red-swap:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - name: free runner disk (monero-sys build needs >14 GB)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
      - name: Setup build environment (cli tools, dependencies)
        uses: ./.github/actions/setup-build-environment
        with:
          host: ubuntu-22.04
      - name: Bounded quote computation (expected red without the fix)
        run: >-
          bash .github/scripts/annotate.sh
          cargo test --package swap --lib --
          asb::event_loop::tests::a_stuck_quote_computation_ends_before_the_request_timeout
