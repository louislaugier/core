# Fork only (05/10/2026): build-asb-mutex builds the maker image but runs no test. This runs
# the unit tests of the fork's own changes on every ci/** push (5.0.3 port, 12/11/2026):
# the serialized Monero lock phase (lock_phase), the wait for our locked change
# (unlock_wait_tests), the setup check that leaves out Monero reserved by swaps in flight
# (setup_reserve_tests), the js-libp2p flood guards (flood_agent_tests, flood_decode_tests),
# the quote tests with the 1 % max headroom (asb::event_loop::tests), and the 40 min mainnet
# lock retry window (swap-env's trusted_daemon_config).
name: fork-unit-tests
on:
  push:
    branches:
      - 'ci/**'
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: free runner disk (monero-sys build needs >14 GB)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
      - name: Setup build environment (cli tools, dependencies)
        uses: ./.github/actions/setup-build-environment
        with:
          host: ubuntu-22.04
      # annotate.sh (ci branches only): a failure publishes its errors and panics as annotations,
      # readable without a login (12/11/2026)
      - name: Unit tests of the fork's lock, setup, flood and quote changes
        run: >-
          bash .github/scripts/annotate.sh
          cargo test --package swap --lib --
          lock_phase unlock_wait_tests setup_reserve_tests flood_agent_tests
          flood_decode_tests asb::event_loop::tests
      - name: The fork's env defaults
        run: bash .github/scripts/annotate.sh cargo test --package swap-env --test trusted_daemon_config
      - name: The fork's key-image check of a built lock (monero-wallet)
        run: bash .github/scripts/annotate.sh cargo test --package monero-wallet --lib -- wallets::tests
